{% extends "base.html" %}
{% block title %}Успеваемость — PGUPS{% endblock %}
{% block content %}
<h1 class="page-title">Успеваемость по курсам</h1>
<div class="status-bar" id="status-bar">Обновление…</div>
<div id="course-grid" class="course-grid"></div>
{% endblock %}
{% block scripts %}
<script>
const ICONS = {
  '+': '<svg viewBox="0 0 16 16" fill="currentColor" width="11" height="11"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0z"/></svg>',
  '-': '<svg viewBox="0 0 16 16" fill="currentColor" width="11" height="11"><path d="M4.22 4.22a.75.75 0 0 1 1.06 0L8 6.94l2.72-2.72a.75.75 0 1 1 1.06 1.06L9.06 8l2.72 2.72a.75.75 0 1 1-1.06 1.06L8 9.06l-2.72 2.72a.75.75 0 0 1-1.06-1.06L6.94 8 4.22 5.28a.75.75 0 0 1 0-1.06z"/></svg>',
  '~': '<svg viewBox="0 0 16 16" fill="currentColor" width="11" height="11"><path d="M8 1a.75.75 0 0 1 .75.75v9.69l2.72-2.72a.75.75 0 1 1 1.06 1.06l-4 4a.75.75 0 0 1-1.06 0l-4-4a.75.75 0 0 1 1.06-1.06l2.72 2.72V1.75A.75.75 0 0 1 8 1z"/></svg>',
  '#': '<svg viewBox="0 0 16 16" fill="currentColor" width="11" height="11"><path d="M8 1a4 4 0 0 0-4 4v2H3a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-1V5a4 4 0 0 0-4-4zm2 6V5a2 2 0 1 0-4 0v2h4z"/></svg>',
  '.': '<svg viewBox="0 0 16 16" fill="currentColor" width="11" height="11"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 12.5A5.5 5.5 0 1 1 8 2.5a5.5 5.5 0 0 1 0 11z"/><path d="M8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4z"/></svg>',
};

function fmtStatus(s) {
  const p = s[0];
  const txt = s.slice(1).trim();
  const cls = p==='+'?'ok':p==='-'?'fail':p==='~'?'sub':p==='#'?'lock':'pend';
  return `<span class="item-status"><span style="margin-right:3px;">${ICONS[p]||''}</span>${txt}</span>`;
}

function skeleton() {
  return Array(4).fill(0).map((_,i) => `<div class="skeleton-card" style="animation:fadeIn .3s ease both;animation-delay:${i*.08}s">
    <div class="skeleton-line" style="width:60%"></div>
    <div class="skeleton-line" style="width:100%;height:10px"></div>
    <div class="skeleton-stats">${Array(4).fill(0).map(()=>'<div class="skeleton-stat"></div>').join('')}</div>
  </div>`).join('');
}

async function fetchData() {
  const bar = document.getElementById('status-bar');
  const grid = document.getElementById('course-grid');
  grid.innerHTML = skeleton();
  bar.textContent = 'Обновление…';
  try {
    const r = await fetch('/api/courses');
    const data = await r.json();
    if (!data.courses?.length) {
      grid.innerHTML = '<div class="card"><p style="color:var(--text-tertiary);font-size:13px;">Нет курсов. <a href="/add-course">Добавьте</a></p></div>';
      bar.textContent = '';
      return;
    }
    grid.innerHTML = data.courses.map((c, i) => {
      if (c.error) return `<div class="course-card" style="animation:fadeIn .3s ease both;animation-delay:${i*.06}s"><div class="course-card-title error">${c.name}</div></div>`;
      const total = c.passed + c.failed + c.submitted + c.locked + c.pending;
      const done = c.passed + c.failed;
      const pct = total ? Math.round(done/total*100) : 0;
      const barColor = pct===100?'var(--success)':pct>50?'var(--warning)':'var(--accent)';
      const items = (c.items||[]).slice(0,8);
      const extra = c.items?.length > 8;
      const itemsHtml = items.map(it =>
        `<div class="item-row${it.changed?' changed':''}">
          <span class="item-name">${it.name}</span>
          <span class="item-status">${it.prev_status?`<span class="item-prev">←${it.prev_status}</span>`:''}${fmtStatus(it.status)}</span>
        </div>`
      ).join('');
      const moreBtn = extra ? `<div style="text-align:center;padding:6px 0;">
        <button class="btn btn-outline btn-sm" onclick="this.parentElement.parentElement.querySelectorAll('.item-row.extra').forEach(e=>e.style.display='flex');this.remove()">+ ещё ${c.items.length - 8}</button>
      </div>` : '';
      return `<div class="course-card" style="animation:fadeIn .3s ease both;animation-delay:${i*.06}s">
        <div class="course-card-header">
          <a class="course-card-title" href="/course/${c.id}">${c.name}</a>
          <div class="stats">
            <span class="stat stat-ok">${ICONS['+']}${c.passed}</span>
            <span class="stat stat-fail">${ICONS['-']}${c.failed}</span>
            <span class="stat stat-sub">${ICONS['~']}${c.submitted}</span>
            <span class="stat stat-lock">${ICONS['#']}${c.locked}</span>
            <span class="stat stat-pend">${ICONS['.']}${c.pending}</span>
          </div>
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
        ${itemsHtml ? `<div class="item-list">${itemsHtml}</div>` : ''}
        ${moreBtn}
      </div>`;
    }).join('');
    bar.textContent = 'Обновлено ' + new Date().toLocaleTimeString('ru-RU');
  } catch(e) {
    grid.innerHTML = skeleton();
    bar.textContent = 'Ошибка обновления';
  }
}

fetchData();
setInterval(fetchData, 60000);
</script>
{% endblock %}
