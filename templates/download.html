{% extends "base.html" %}
{% block title %}Скачивание — PGUPS{% endblock %}
{% block content %}
<h1 class="page-title">Скачивание лабораторных</h1>

<div class="card">
  <div class="card-title">Выберите курсы</div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    {% for c in courses %}
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
      <input type="checkbox" value="{{ c.id }}" style="width:16px;height:16px;cursor:pointer;">
      <span>{{ c.name }}</span>
    </label>
    {% endfor %}
  </div>
  <div style="margin-top:12px;">
    <button class="btn btn-outline btn-sm" onclick="toggleAllCourses(true)">Выбрать все</button>
    <button class="btn btn-outline btn-sm" onclick="toggleAllCourses(false)">Снять все</button>
  </div>
</div>

<div class="card" style="margin-top:16px;">
  <div class="card-title">Что скачивать</div>
  <div style="display:flex;gap:16px;">
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
      <input type="checkbox" id="dl-submission" checked style="width:16px;height:16px;cursor:pointer;">
      Мои отправки
    </label>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
      <input type="checkbox" id="dl-attachment" checked style="width:16px;height:16px;cursor:pointer;">
      Задания
    </label>
  </div>
</div>

<div class="card" style="margin-top:16px;">
  <div class="form-group">
    <label class="form-label" for="workers">Количество потоков</label>
    <input type="number" id="workers" class="form-input" value="{{ default_workers }}" min="1" max="10" style="width:100px;">
  </div>
  <button class="btn btn-primary" onclick="startDownload()">Начать скачивание</button>
</div>

<div class="card" id="progress-card" style="display:none;margin-top:16px;">
  <div class="card-title">Статус скачивания</div>
  <div id="progress-message" style="font-size:14px;"></div>
  <div class="progress-mini" style="margin:12px 0;"><div class="progress-mini-fill" id="progress-fill" style="width:0%"></div></div>
  <div id="progress-text" style="font-size:12px;color:var(--text-secondary);"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
function toggleAllCourses(checked) {
  document.querySelectorAll('#course-list input').forEach(c => c.checked = checked);
}

function getSelected() {
  const checks = document.querySelectorAll('#course-list input:checked');
  return Array.from(checks).map(c => c.value);
}

function getDownloadType() {
  const sub = document.getElementById('dl-submission').checked;
  const att = document.getElementById('dl-attachment').checked;
  if (sub && att) return 'both';
  if (sub) return 'submission';
  if (att) return 'attachment';
  return 'none';
}

function startDownload() {
  const ids = getSelected();
  if (ids.length === 0) { flash('Выберите хотя бы один курс', 'error'); return; }
  const dt = getDownloadType();
  if (dt === 'none') { flash('Выберите тип скачивания', 'error'); return; }
  const workers = document.getElementById('workers').value || 3;
  fetch('/api/download', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({course_ids: ids, workers: parseInt(workers), download_type: dt}),
  }).then(r => r.json()).then(d => {
    if (d.error) { flash(d.error, 'error'); return; }
    flash('Скачивание запущено', 'success');
    pollProgress();
  });
}

function pollProgress() {
  const card = document.getElementById('progress-card');
  const msg = document.getElementById('progress-message');
  const fill = document.getElementById('progress-fill');
  const text = document.getElementById('progress-text');
  card.style.display = 'block';
  const iv = setInterval(async () => {
    const r = await fetch('/api/download/status');
    const d = await r.json();
    msg.textContent = d.message;
    if (d.progress) {
      const parts = d.progress.split('/');
      const done = parseInt(parts[0]), total = parseInt(parts[1]);
      fill.style.width = total > 0 ? Math.round(done/total*100) + '%' : '0%';
      text.textContent = d.progress;
    }
    if (!d.running) { clearInterval(iv); }
  }, 1000);
}
</script>
{% endblock %}
