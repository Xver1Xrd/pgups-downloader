<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PGUPS{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafafa;
  --bg-alt: #f3f4f6;
  --surface: #ffffff;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --text: #111827;
  --text-secondary: #6b7280;
  --text-tertiary: #9ca3af;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-subtle: #eff6ff;
  --success: #059669;
  --success-subtle: #ecfdf5;
  --danger: #dc2626;
  --danger-subtle: #fef2f2;
  --warning: #d97706;
  --warning-subtle: #fffbeb;
  --indigo: #4f46e5;
  --indigo-subtle: #eef2ff;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,.04), 0 2px 4px rgba(0,0,0,.03);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== Header ===== */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  height: 52px;
  padding: 0 24px;
  gap: 32px;
}
.header-brand {
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  letter-spacing: -.02em;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.header-brand-dot {
  width: 8px;
  height: 8px;
  background: var(--accent);
  border-radius: 50%;
  flex-shrink: 0;
}
.header-nav {
  display: flex;
  gap: 2px;
  overflow-x: auto;
}
.header-nav a {
  color: var(--text-secondary);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  transition: all .12s;
  white-space: nowrap;
}
.header-nav a:hover {
  background: var(--bg-alt);
  color: var(--text);
}
.header-nav a.active {
  background: var(--accent-subtle);
  color: var(--accent);
  font-weight: 600;
}

/* ===== Auth Banner ===== */
.auth-banner {
  background: var(--warning-subtle);
  border-bottom: 1px solid #fde68a;
  padding: 10px 24px;
  text-align: center;
  font-size: 13px;
  color: #92400e;
  display: none;
}
.auth-banner a { color: #92400e; font-weight: 600; }

/* ===== Layout ===== */
.container {
  max-width: 1120px;
  margin: 0 auto;
  padding: 28px 24px 48px;
}

/* ===== Typography ===== */
.page-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: -.02em;
  color: var(--text);
}
.page-subtitle {
  font-size: 13px;
  color: var(--text-tertiary);
  margin-bottom: 24px;
}

/* ===== Cards ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: box-shadow .15s;
}
.card + .card { margin-top: 16px; }
.card:hover { box-shadow: var(--shadow-sm); }
.card-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--text);
  letter-spacing: -.01em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  text-decoration: none;
  transition: all .12s;
  line-height: 1.4;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { transform: scale(.98); }
.btn-danger {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}
.btn-danger:hover { background: #b91c1c; }
.btn-outline {
  background: var(--surface);
  color: var(--text-secondary);
  border-color: var(--border);
}
.btn-outline:hover {
  background: var(--bg-alt);
  color: var(--text);
  border-color: var(--border-strong);
}
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ===== Form ===== */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  padding: 8px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  transition: all .12s;
}
.form-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,.08);
}
.form-input::placeholder { color: var(--text-tertiary); }
.form-hint {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 4px;
}

/* ===== Messages ===== */
.msg {
  padding: 10px 14px;
  border-radius: var(--radius);
  margin-bottom: 12px;
  font-size: 13px;
  animation: flashIn .25s ease;
}
@keyframes flashIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
.msg-success { background: var(--success-subtle); color: var(--success); border: 1px solid #a7f3d0; }
.msg-error { background: var(--danger-subtle); color: var(--danger); border: 1px solid #fecaca; }

/* ===== Course Grid ===== */
.course-grid {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
}
.course-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
  transition: all .15s;
  cursor: pointer;
  text-decoration: none;
  display: block;
}
.course-card:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow-md);
}
.course-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}
.course-card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
  display: block;
}
.course-card-title:hover { text-decoration: none; }
.course-card-title.error { color: var(--danger); }

/* Stats pills */
.stats { display: flex; gap: 6px; flex-wrap: wrap; }
.stat {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .01em;
}
.stat-ok { background: var(--success-subtle); color: var(--success); }
.stat-fail { background: var(--danger-subtle); color: var(--danger); }
.stat-sub { background: var(--warning-subtle); color: var(--warning); }
.stat-lock { background: var(--indigo-subtle); color: var(--indigo); }
.stat-pend { background: var(--bg-alt); color: var(--text-tertiary); }

/* Progress bar */
.progress-bar {
  height: 3px;
  background: var(--bg-alt);
  border-radius: 2px;
  overflow: hidden;
  margin: 8px 0 12px;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width .4s ease;
}

/* Items list */
.item-list { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
.item-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  font-size: 12px;
  gap: 8px;
}
.item-name {
  color: var(--text);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.item-status {
  white-space: nowrap;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
}
.item-row.changed {
  background: var(--accent-subtle);
  border-radius: 4px;
  padding: 4px 8px;
  margin: 0 -8px;
}
.item-prev { font-size: 10px; color: var(--text-tertiary); text-decoration: line-through; margin-left: 4px; }

/* Status bar */
.status-bar {
  font-size: 12px;
  color: var(--text-tertiary);
  text-align: right;
  margin-bottom: 20px;
}

/* Check list */
.check-list { list-style: none; }
.check-list li {
  padding: 8px 0;
  border-bottom: 1px solid var(--bg-alt);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.check-list li:last-child { border-bottom: none; }

/* Grid helpers */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* Footer */
.footer {
  text-align: center;
  padding: 32px 24px;
  font-size: 12px;
  color: var(--text-tertiary);
}
.footer a { color: var(--text-tertiary); text-decoration: none; }
.footer a:hover { color: var(--text-secondary); }

/* Skeleton loading */
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
.skeleton-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px; }
.skeleton-line {
  height:12px;border-radius:4px;
  background:linear-gradient(90deg,var(--bg-alt) 25%,var(--bg) 50%,var(--bg-alt) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;margin-bottom:10px;
}
.skeleton-line:last-child { width: 55%; }
.skeleton-stats { display:flex;gap:6px;margin:12px 0 10px; }
.skeleton-stat { height:20px;width:48px;border-radius:20px;background:linear-gradient(90deg,var(--bg-alt) 25%,var(--bg) 50%,var(--bg-alt) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite; }

/* Responsive */
@media (max-width: 768px) {
  .grid-2 { grid-template-columns: 1fr; }
  .course-grid { grid-template-columns: 1fr; }
  .header-inner { padding: 0 16px; gap: 16px; }
  .header-nav { gap: 0; }
  .header-nav a { padding: 6px 8px; font-size: 12px; }
  .container { padding: 20px 16px 40px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-brand-dot"></div>
      PGUPS
    </div>
    <nav class="header-nav">
      <a href="/" class="{% if request.path == '/' %}active{% endif %}">Успеваемость</a>
      <a href="/download" class="{% if request.path == '/download' %}active{% endif %}">Скачивание</a>
      <a href="/add-course" class="{% if request.path == '/add-course' %}active{% endif %}">Добавить курс</a>
      <a href="/settings" class="{% if request.path == '/settings' %}active{% endif %}">Настройки</a>
    </nav>
  </div>
</div>

<div class="auth-banner" id="auth-banner"></div>

<div class="container">
  <div id="flash-container"></div>
  {% block content %}{% endblock %}
</div>

<div class="footer">
  <a href="https://github.com/Xver1Xrd" target="_blank">xverlxrd</a> &middot; PGUPS Downloader
</div>

<script>
function flash(msg, type) {
  const c = document.getElementById('flash-container');
  const d = document.createElement('div');
  d.className = 'msg msg-' + type;
  d.textContent = msg;
  c.appendChild(d);
  setTimeout(() => d.remove(), 5000);
}

async function checkAuth() {
  const banner = document.getElementById('auth-banner');
  for (let i = 0; i < 20; i++) {
    try {
      const r = await fetch('/api/auth/status');
      const d = await r.json();
      if (d.authenticated) { banner.style.display = 'none'; return; }
      if (d.login) {
        banner.innerHTML = 'Вход в систему… <span style="opacity:.6;">(' + (i+1) + '/20)</span>';
        banner.style.display = 'block';
      }
    } catch(e) {}
    await new Promise(r => setTimeout(r, 1500));
  }
  banner.innerHTML = 'Не удалось войти. <a href="/settings" style="margin-right:8px;">Проверьте учётные данные</a>'
    + '<button class="btn btn-outline btn-sm" onclick="showCaptchaForm()" style="margin-left:8px;padding:4px 8px;font-size:12px;">Капча</button>';
}

async function showCaptchaForm() {
  const banner = document.getElementById('auth-banner');
  try {
    const r = await fetch('/api/auth/captcha');
    const d = await r.json();
    if (!d.captcha_b64) { banner.innerHTML = 'Ошибка загрузки капчи'; return; }
    banner.innerHTML = '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;">'
      + '<img src="data:image/png;base64,' + d.captcha_b64 + '" style="height:40px;border-radius:4px;border:1px solid #fde68a;background:#fff;">'
      + '<input type="text" id="captcha-input" placeholder="Код" style="padding:6px 10px;border:1px solid #fde68a;border-radius:var(--radius);font-size:13px;width:100px;">'
      + '<button class="btn btn-primary btn-sm" onclick="loginWithCaptcha()" style="padding:6px 12px;font-size:12px;">Войти</button>'
      + '<button class="btn btn-outline btn-sm" onclick="checkAuth()" style="padding:6px 12px;font-size:12px;">Отмена</button>'
      + '</div>'
      + '<input type="hidden" id="csrf-token" value="' + d.csrf_token + '">';
  } catch(e) { banner.innerHTML = 'Ошибка загрузки капчи'; }
}

async function loginWithCaptcha() {
  const banner = document.getElementById('auth-banner');
  const captcha = document.getElementById('captcha-input').value.trim();
  const csrf = document.getElementById('csrf-token').value;
  if (!captcha) return;
  banner.innerHTML = 'Проверяю…';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({captcha, csrf_token: csrf}),
    });
    const d = await r.json();
    if (d.authenticated) { banner.style.display = 'none'; flash('Вход выполнен', 'success'); }
    else { banner.innerHTML = 'Неверная капча. <a href="#" onclick="showCaptchaForm();return false;">Попробовать снова</a>'; }
  } catch(e) { banner.innerHTML = 'Ошибка сети'; }
}

document.addEventListener('DOMContentLoaded', checkAuth);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
